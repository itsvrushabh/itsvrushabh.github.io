name: CI Quality & Content Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-assets:
    name: Lint & Validate Assets & Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify JavaScript Syntax
        run: |
          echo "Verifying omarchy.js syntax..."
          node --check assets/js/omarchy.js
          echo "✓ JavaScript syntax valid."

      - name: Validate JSON Data Files
        run: |
          echo "Validating JSON data files in _data/..."
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dataDir = '_data';
          if (fs.existsSync(dataDir)) {
            fs.readdirSync(dataDir).forEach(f => {
              if (f.endsWith('.json')) {
                JSON.parse(fs.readFileSync(path.join(dataDir, f), 'utf8'));
                console.log('✓ ' + f + ' is valid JSON');
              }
            });
          }
          "

  validate-rust:
    name: Build & Verify Rust Sync Tool
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/portfolio-sync -> target"

      - name: Cargo Check
        run: |
          cargo check --workspace --all-targets

  validate-jekyll:
    name: Build & Verify Jekyll Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Jekyll & Core Plugins
        run: |
          gem install jekyll jekyll-feed jekyll-sitemap jekyll-seo-tag kramdown rouge

      - name: Build Jekyll Site
        run: |
          jekyll build --strict_front_matter --trace
