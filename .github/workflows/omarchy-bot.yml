name: Workstation Agentic Bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  workstation-agent:
    name: Workstation Automated Triage
    runs-on: ubuntu-latest
    steps:
      - name: Agentic Dispatch Response
        uses: actions/github-script@v7
        with:
          script: |
            const isIssue = !!context.payload.issue;
            const author = context.actor;

            if (isIssue) {
              const issueNumber = context.payload.issue.number;
              const commentBody = `### ⚡ VRUSHABH WORKSTATION // DISPATCH LOGGED
            
            Welcome, @${author}!
            
            The workstation automated triage agent has registered your dispatch:
            - **Target:** itsvrushabh systems & architecture
            - **Environment:** Arch Linux / Hyprland (Wayland)
            - **Status:** 🟢 Dispatched to Vrushabh Deshmukh
            
            > *"Building malleable, low-latency backends and keyboard-driven developer environments."*
            
            Vrushabh will review this issue shortly. Thank you for reaching out! 🚀`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody
              });
            } else {
              const prNumber = context.payload.pull_request.number;
              const headBranch = context.payload.pull_request.head.ref;
              const commentBody = `### 🛠️ VRUSHABH WORKSTATION // PR REVIEW INITIATED
            
            Thanks for your contribution, @${author}!
            
            Workstation verification running on branch \`${headBranch}\`:
            - **Target:** Clean borrow-checker traces, zero memory leaks
            - **Tooling:** rust-analyzer, pyright & Jekyll CI validation
            - **Status:** Queued for review
            
            Vrushabh will inspect your diffs shortly! ⚡`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
