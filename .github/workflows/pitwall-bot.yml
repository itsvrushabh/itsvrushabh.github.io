name: Red Bull RB19 Pit Wall Bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  pitwall-bot:
    name: Pit Wall Bot Triage
    runs-on: ubuntu-latest
    steps:
      - name: Pit Wall Radio Response
        uses: actions/github-script@v7
        with:
          script: |
            const isIssue = !!context.payload.issue;
            const author = context.actor;

            if (isIssue) {
              const issueNumber = context.payload.issue.number;
              const commentBody = `### 🏎️ PIT WALL TELEMETRY // CAR #7 DISPATCH
            
            Copy that, @${author}! Radio channel is open.
            
            Our **Red Bull RB19 telemetry sensors** have logged your ticket into our paddock queue:
            - **Status:** 🟢 Track Active / Telemetry Green
            - **Car:** #7 (Vrushabh Deshmukh)
            - **Target:** Sub-millisecond p99 resolution
            
            > *"Pushing zero-allocation binary to production cluster. Stand by for technical telemetry review."*
            
            Stay tuned to frequency \`142.850 MHz\`. 🏁💨`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody
              });
            } else {
              const prNumber = context.payload.pull_request.number;
              const headBranch = context.payload.pull_request.head.ref;
              const commentBody = `### 🏁 RED BULL RB19 // PIT STOP IN PROGRESS
            
            Welcome to the pit lane, @${author}!
            
            Engineering telemetry initiated for branch \`${headBranch}\`:
            - **Chassis:** Red Bull RB19 (#7)
            - **Aero Checks:** Zero memory leaks, clean borrow-checker traces
            - **Target Latency:** < 0.50ms
            
            > *"Box, box, box! Fresh soft tires fitted. Analyzing aerodynamics and commit telemetry."*
            
            The pit crew will review your pull request shortly! 🏎️⚡`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
