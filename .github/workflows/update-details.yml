name: Sync Portfolio Details & Metrics

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "_posts/**"
      - "tools/portfolio-sync/**"

permissions:
  contents: write

concurrency:
  group: "sync-details"
  cancel-in-progress: true

jobs:
  sync-details:
    name: Sync GitHub Metrics & Dispatches (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/portfolio-sync -> target"

      - name: Execute Details Synchronization in Rust
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd tools/portfolio-sync
          cargo run --release

      - name: Commit & Push Updated Details
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain _data/ README.md) ]]; then
            echo "Changes detected in _data/ or README.md. Committing..."
            git add _data/ README.md
            git commit -m "chore(auto): sync github metrics, project details and dispatches [Rust]"
            git push origin main
          else
            echo "No telemetry changes detected. Clean working tree."
          fi
