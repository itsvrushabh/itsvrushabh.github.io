name: Update Language Radar Bot

on:
  schedule:
    # Run every Monday at 06:00 UTC (11:30 AM IST)
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_language_radar.py"

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Language Radar Updater Bot
        run: |
          chmod +x scripts/update_language_radar.py
          python3 scripts/update_language_radar.py

      - name: Commit and push if changes detected
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/TECH_RADAR.md
          if git diff --staged --quiet; then
            echo "✅ Documentation is already up to date. No commit needed."
          else
            git commit -m "chore(radar): auto-update language evolution radar in README & docs"
            git push
            echo "🚀 Changes pushed successfully!"
          fi
