name: Update Repositories Catalog Bot

on:
  schedule:
    # Run every Monday at 06:30 UTC (12:00 PM IST)
    - cron: "30 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_repositories.py"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Repositories Catalog Updater Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/update_repositories.py
          python3 scripts/update_repositories.py

      - name: Commit and push if changes detected
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REPOSITORIES.md
          if git diff --staged --quiet; then
            echo "✅ Repositories catalog is already up to date. No commit needed."
          else
            git commit -m "chore(catalog): auto-update repository catalog in docs/REPOSITORIES.md"
            git push
            echo "🚀 Catalog changes pushed successfully!"
          fi
