# GitHub Pages & Jekyll Configuration
title: Vrushabh Deshmukh
tagline: Backend Developer & Systems Engineer
description: "Personal website, technical engineering blog, and systems architecture portfolio of Vrushabh Deshmukh."
url: "https://itsvrushabh.github.io"
baseurl: ""
repository: itsvrushabh/itsvrushabh.github.io

# Author & Social Information
author:
  name: Vrushabh Deshmukh
  email: itsvrushabh@gmail.com
  bio: "Systems and backend engineer specializing in Rust, Tokio, high-throughput distributed microservices, and Linux systems architecture."
  github: itsvrushabh
  linkedin: itsvrushabh
  location: "India"

# Blog Permalink Configuration
permalink: /blog/:title/

# Markdown & Syntax Highlighting
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Default Layouts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# GitHub Pages Supported Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Exclude non-site development files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - tools
  - target
  - Cargo.toml
  - Cargo.lock
  - .github
  - README.md
  - tests
  - package.json
  - package-lock.json
