<!-- ==========================================
     OMARCHY COMMAND PALETTE (Ctrl+K / Super+Space)
     ========================================== -->
<div id="command-palette-modal" class="omarchy-modal palette-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="palette-input">
  <div class="omarchy-modal-backdrop" data-close-palette></div>
  <div class="omarchy-modal-card palette-card">
    <!-- Search Bar Input -->
    <div class="palette-input-wrap">
      <svg class="palette-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="palette-input" class="palette-input" placeholder="Type a command, theme name, or search pages..." autocomplete="off" spellcheck="false" aria-label="Command palette query">
      <kbd class="palette-esc-kbd">Esc</kbd>
    </div>

    <!-- Results List -->
    <div id="palette-results" class="palette-results" role="listbox">
      <!-- Items dynamically populated by JS with fuzzy matching -->
    </div>

    <!-- Palette Footer -->
    <div class="palette-footer">
      <div class="palette-hints">
        <span><kbd>&uarr;</kbd> <kbd>&darr;</kbd> to navigate</span>
        <span><kbd>&crarr;</kbd> to select</span>
        <span><kbd>Esc</kbd> to close</span>
      </div>
      <div class="palette-power">
        <span>System Launcher</span>
      </div>
    </div>
  </div>
</div>
