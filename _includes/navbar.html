<header class="site-header">
  <div class="container-fluid header-container">
    <a href="{{ '/' | relative_url }}" class="brand-logo" title="Vrushabh Deshmukh Home">
      <div class="f1-badge">
        <span class="f1-num">7</span>
        <span class="f1-team">VD</span>
      </div>
      <div class="brand-text-col">
        <span class="brand-title">VRUSHABH DESHMUKH</span>
        <span class="brand-sub">BACKEND &middot; SYSTEMS ARCHITECT</span>
      </div>
    </a>

      <span class="ham-bar"></span>

      <span class="ham-bar"></span>
    </button>

    <nav class="nav-menu" id="nav-menu">
      <ul class="nav-list">
        <li>
          <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">
            <span class="nav-idx">01</span>
            <span class="roll-text"><span class="roll-text-inner" data-text="HOME">HOME</span></span>
          </a>
        </li>
        <li>

            <span class="nav-idx">02</span>
            <span class="roll-text"><span class="roll-text-inner" data-text="ON TRACK">ON TRACK</span></span>
          </a>
        </li>
        <li>
          <a href="{{ '/blog/' | relative_url }}" class="nav-link {% if page.url contains '/blog/' %}active{% endif %}">
            <span class="nav-idx">03</span>
            <span class="roll-text"><span class="roll-text-inner" data-text="DISPATCHES">DISPATCHES</span></span>
          </a>
        </li>
        <li>
          <a href="{{ '/about/' | relative_url }}" class="nav-link {% if page.url contains '/about/' %}active{% endif %}">

        </li>
        <li>

            <span class="roll-text"><span class="roll-text-inner" data-text="RADIO">RADIO</span></span>
          </a>
        </li>
