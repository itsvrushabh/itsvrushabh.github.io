<!-- ================================================================
     OMARCHY MENUBAR — Sleek Minimal OS Top Bar
     Left:   🏠  1  2  3  4  5 (Hyprland Workspaces with HUD)
     Center: Date & Time (Clickable for terminal cal & uptime)
     Right:  Themes · Songs (with Live EQ) · Git · Contact (Icons only)
     ================================================================ -->
<header class="site-header" role="banner">
  <div class="menubar-inner">

    <!-- ── LEFT: Simple Home Icon + 1 to 5 Numbers (Plugins, Dispatches, Manual, Themes, Resume) ── -->
    <nav class="menubar-left" aria-label="Workspaces">
      <!-- Simple Home Icon -->
      <a href="{{ '/' | relative_url }}"
         class="mb-item mb-home {% if page.url == '/' %}active{% endif %}"
         data-ws-name="Home Overview"
         title="Home" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </a>

      <span class="mb-divider" aria-hidden="true"></span>

      <!-- 1: Plugins & Code -->
      <a href="{{ '/projects/' | relative_url }}"
         class="mb-item mb-num {% if page.url contains '/projects/' %}active{% endif %}"
         data-ws-num="1" data-ws-name="Plugins &amp; Code"
         title="1: Plugins &amp; Code" aria-label="1: Plugins and Code">
        <span>1</span>
      </a>

      <!-- 2: Dispatches -->
      <a href="{{ '/blog/' | relative_url }}"
         class="mb-item mb-num {% if page.url contains '/blog/' %}active{% endif %}"
         data-ws-num="2" data-ws-name="Dispatches / Blog"
         title="2: Dispatches" aria-label="2: Dispatches">
        <span>2</span>
      </a>

      <!-- 3: Manual -->
      <a href="{{ '/about/' | relative_url }}"
         class="mb-item mb-num {% if page.url contains '/about/' %}active{% endif %}"
         data-ws-num="3" data-ws-name="Manual &amp; Philosophy"
         title="3: Manual" aria-label="3: Manual">
        <span>3</span>
      </a>

      <!-- 4: Contact -->
      <a href="{{ '/contact/' | relative_url }}"
         class="mb-item mb-num {% if page.url contains '/contact/' %}active{% endif %}"
         data-ws-num="4" data-ws-name="Contact &amp; Telemetry"
         title="4: Contact" aria-label="4: Contact">
        <span>4</span>
      </a>

      <!-- 5: Resume -->
      <a href="{{ '/resume/' | relative_url }}"
         class="mb-item mb-num {% if page.url contains '/resume/' %}active{% endif %}"
         data-ws-num="5" data-ws-name="Systems Driver Resume"
         title="5: Resume" aria-label="5: Resume">
        <span>5</span>
      </a>
    </nav>

    <!-- ── MIDDLE: Live Date & Time + Terminal Calendar Popover ── -->
    <div class="menubar-center" aria-live="polite" aria-atomic="true">
      <button id="menubar-datetime" class="mb-clock" title="Click to view System Calendar &amp; Uptime" aria-label="System Date &amp; Time" aria-expanded="false">
        <span class="mb-clock-date"></span>
        <span class="mb-clock-sep">·</span>
        <span class="mb-clock-time"></span>
      </button>

      <!-- Terminal Calendar Popover (cal) -->
      <div id="menubar-calendar-popover" class="mb-calendar-popover" aria-hidden="true">
        <div class="mb-cal-header">
          <span class="mb-cal-title" id="cal-month-year"></span>
          <span class="mb-cal-uptime" id="cal-uptime">up 0m</span>
        </div>
        <div class="mb-cal-grid" id="cal-days-grid">
          <!-- Calendar matrix injected by JS -->
        </div>
        <div class="mb-cal-footer">
          <span>OMARCHY ARCH/SYS</span>
          <span class="mb-cal-time-live" id="cal-time-live"></span>
        </div>
      </div>
    </div>

    <!-- ── RIGHT: Themes, Songs, Git, Contact (Icon Only) ── -->
    <div class="menubar-right" aria-label="Controls">

      <!-- Themes (Icon only) -->
      <button id="theme-toggle-btn"
              class="mb-item mb-action"
              title="Themes: Cycle Theme (T)"
              aria-label="Themes: Cycle color theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
          <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
          <circle cx="8.5"  cy="7.5"  r=".5" fill="currentColor"/>
          <circle cx="6.5"  cy="12.5" r=".5" fill="currentColor"/>
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.563-2.512 5.563-5.563C22 6.5 17.5 2 12 2Z"/>
        </svg>
      </button>

      <!-- Songs (Icon only with live animated equalizer) -->
      <button id="header-music-toggle"
              class="mb-item mb-action"
              title="Songs: Toggle Background Music (M)"
              aria-label="Songs: Toggle background music">
        <!-- Sound OFF icon -->
        <svg id="header-sound-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9"  x2="17" y2="15"/>
          <line x1="17" y1="9"  x2="23" y2="15"/>
        </svg>
        <!-- Sound ON icon -->
        <svg id="header-sound-on-icon" style="display:none;" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <!-- Mini animated equalizer bars in topbar -->
        <span class="mb-eq-bars" id="header-eq-bars" aria-hidden="true">
          <span class="mb-eq-bar"></span>
          <span class="mb-eq-bar"></span>
          <span class="mb-eq-bar"></span>
        </span>
      </button>

      <!-- Git (Icon only) -->
      <a href="https://github.com/{{ site.author.github }}"
         target="_blank" rel="noopener noreferrer"
         class="mb-item mb-action"
         title="Git: GitHub Profile (@{{ site.author.github }})"
         aria-label="Git: GitHub profile">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
      </a>

      <!-- Contact (Icon only) -->
      <a href="{{ '/contact/' | relative_url }}"
         class="mb-item mb-action {% if page.url contains '/contact/' %}active{% endif %}"
         title="Contact" aria-label="Contact">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      </a>

      <!-- Command Palette / Search (Extra icon on desktop) -->
      <button id="open-palette-btn"
              class="mb-item mb-action mb-action--extra"
              title="Command Palette (Ctrl+K)"
              aria-label="Command palette">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>

      <!-- Keyboard Shortcuts Help (Extra icon on desktop) -->
      <button data-open-shortcuts
              class="mb-item mb-action mb-action--kbd mb-action--extra"
              title="Shortcuts (?)"
              aria-label="Keyboard shortcuts">
        <kbd>?</kbd>
      </button>
    </div>

  </div>

  <!-- Floating Hyprland-Style Workspace Tooltip HUD -->
  <div id="mb-workspace-hud" class="mb-workspace-hud" aria-hidden="true">
    <span class="hud-num">[1]</span>
    <span class="hud-name">Plugins &amp; Code</span>
  </div>
</header>
