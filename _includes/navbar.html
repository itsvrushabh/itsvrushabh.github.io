<header class="site-header">
  <div class="container header-container">
    <a href="{{ '/' | relative_url }}" class="brand-wrap" title="Vrushabh Deshmukh">
      <svg class="brand-icon" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path clip-rule="evenodd" d="m1200 1200h-480v-80h400v-1040h-479.996v160h-400v720h720v-720h-80v-80h159.996v880h-400v160h-640v-1200h1200zm-1120-80h480v-80h-400l.004-400h-80.004zm0-560h80.004v-400h400v-80h-480.004z" fill="currentColor" fill-rule="evenodd"/>
      </svg>
      <span class="brand-text">VRUSHABH DESHMUKH</span>
    </a>

    <nav class="nav-menu" id="nav-menu" aria-label="Main Navigation">
      <ul class="nav-links">
        <li>
          <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
        </li>
        <li>
          <a href="{{ '/projects/' | relative_url }}" class="nav-link {% if page.url contains '/projects/' %}active{% endif %}">Plugins &amp; Code</a>
        </li>
        <li>
          <a href="{{ '/blog/' | relative_url }}" class="nav-link {% if page.url contains '/blog/' %}active{% endif %}">Dispatches</a>
        </li>
        <li>
          <a href="{{ '/about/' | relative_url }}" class="nav-link {% if page.url contains '/about/' %}active{% endif %}">Manual</a>
        </li>
        <li>
          <a href="{{ '/#themes' | relative_url }}" class="nav-link">Themes</a>
        </li>
        <li>
          <a href="{{ '/resume/' | relative_url }}" class="nav-link {% if page.url contains '/resume/' %}active{% endif %}">Resume</a>
        </li>
      </ul>

      <div class="header-actions">
        <!-- Theme Switcher Palette Trigger -->
        <button id="theme-toggle-btn" class="icon-action-btn" title="Cycle Theme (Press 'T')" aria-label="Cycle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
            <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
            <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
            <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.563-2.512 5.563-5.563C22 6.5 17.5 2 12 2Z"></path>
          </svg>
        </button>

        <!-- Ambient Music Sound Trigger -->
        <button id="header-music-toggle" class="icon-action-btn" title="Toggle Music (Press 'M')" aria-label="Toggle background music">
          <svg id="header-sound-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
          <svg id="header-sound-on-icon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>

        <!-- Command Palette Trigger (Ctrl+K / Super+Space) -->
        <button id="open-palette-btn" class="icon-action-btn" title="Command Palette (Ctrl+K / Super+Space)" aria-label="Open command palette">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <!-- Keyboard Shortcuts Trigger -->
        <button data-open-shortcuts class="icon-action-btn" title="Keyboard Shortcuts (Press '?')" aria-label="Open keyboard shortcuts">
          <kbd style="padding: 0.1rem 0.35rem; font-size: 0.75rem;">?</kbd>
        </button>

        <!-- GitHub External Link -->
        <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer" class="icon-action-btn" title="GitHub Profile (@{{ site.author.github }})" aria-label="GitHub profile">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
        </a>

        <!-- Contact CTA Button -->
        <a href="{{ '/contact/' | relative_url }}" class="btn-omarchy-primary btn-sm">
          <span>Contact</span>
        </a>
      </div>
    </nav>

    <!-- Mobile Hamburger Toggle -->
    <button id="mobile-toggle" class="mobile-toggle-btn" aria-label="Toggle navigation menu" aria-expanded="false">
      <span class="ham-line"></span>
      <span class="ham-line"></span>
      <span class="ham-line"></span>
    </button>
  </div>
</header>
