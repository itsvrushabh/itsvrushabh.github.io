<!DOCTYPE html>
<html lang="en" data-theme="tokyo-night">
<head>
  {% include head.html %}
</head>
<body class="site-body">
  <!-- Ambient Animated Background Canvas & Scanlines -->
  <canvas id="omarchy-canvas" class="omarchy-canvas" aria-hidden="true"></canvas>
  <div class="omarchy-scanlines" aria-hidden="true"></div>

  {% include navbar.html %}

  <main class="site-main" id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Ambient Music Player (Kevin Koontz - We Can Fix Everything) -->
  {% include music-player.html %}

  <!-- Floating Bottom-Right Status Tray: HW Telemetry & Shortcuts -->
  <div class="floating-status-tray">
    <div class="floating-hw-pill" id="floating-hw-pill" title="Hardware Render Engine &amp; Performance Telemetry">
      <span class="hw-dot" aria-hidden="true"></span>
      <span id="hw-fps" class="hw-val">60 FPS</span>
      <span class="hw-sep" aria-hidden="true">&middot;</span>
      <span id="hw-renderer" class="hw-val">Canvas2D</span>
    </div>
    <button data-open-shortcuts class="floating-shortcut-pill" aria-label="Open keyboard shortcuts cheatsheet">
      <kbd>?</kbd> <span>Shortcuts</span> &middot; <kbd>T</kbd> <span>Theme</span>
    </button>
  </div>

  <!-- Live Toast Notification Container -->
  <div id="omarchy-toast" class="omarchy-toast" aria-live="polite"></div>

  <!-- Keyboard Shortcuts Cheatsheet Modal -->
  {% include shortcuts-modal.html %}

  <!-- Omarchy Command Palette Modal (Ctrl+K / Super+Space) -->
  {% include command-palette.html %}

  <!-- Omarchy Core Script (Themes, TUI, Shortcuts, Canvas Animation) -->
  <script src="{{ '/assets/js/omarchy.js' | relative_url }}"></script>
</body>
</html>
